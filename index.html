<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary-Decimal Converter</title>

<style>
  :root {
    --primary: #007bff;
    --danger: #f44336;
    --bg: #f8f9fa;
    --text: #222;
    --card-bg: #fff;
  }

  body.dark {
    --primary: #00bcd4;
    --danger: #ff5252;
    --bg: #121212;
    --text: #eee;
    --card-bg: #1f1f1f;
  }

  * {
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
    transition: all 0.3s ease;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--primary), #00c6ff);
    display: flex;
    justify-content: center;
    align-items: center;
    background-attachment: fixed;
  }

  .converter-box {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
    width: 90%;
    max-width: 380px;
    animation: fadeIn 0.7s ease;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: scale(0.95);}
    to {opacity: 1; transform: scale(1);}
  }

  h1 {
    margin-bottom: 25px;
    font-size: 1.8em;
    color: var(--primary);
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    margin-bottom: 15px;
    outline: none;
    color: var(--text);
    background: var(--card-bg);
  }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 6px var(--primary);
  }

  .button-group {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  button {
    flex: 1;
    margin: 5px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background-color: var(--primary);
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  button:hover {
    transform: translateY(-2px);
  }

  .clear-btn {
    background-color: var(--danger);
  }

  .output {
    margin-top: 15px;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s, transform 0.5s;
  }

  .output.show {
    opacity: 1;
    transform: translateY(0);
  }

  .footer {
    margin-top: 25px;
    font-size: 13px;
    color: #888;
  }

  .toggle-dark {
    position: absolute;
    top: 20px;
    right: 20px;
    background: var(--card-bg);
    border: none;
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
    color: var(--text);
    font-weight: 500;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  .toggle-dark:hover {
    background: var(--primary);
    color: #fff;
  }
</style>
</head>
<body>

<button class="toggle-dark" onclick="toggleDarkMode()">🌙 Dark Mode</button>

<div class="converter-box">
  <h1>Binary ↔ Decimal Converter</h1>

  <input type="text" id="inputField" placeholder="Enter a number">

  <div class="button-group">
    <button onclick="decimalToBinary()">Decimal → Binary</button>
    <button onclick="binaryToDecimal()">Binary → Decimal</button>
  </div>

  <button class="clear-btn" onclick="clearOutput()">Clear</button>

  <div class="output" id="outputLabel"></div>

  <div class="footer">❤️ </div>
</div>

<script>
function decimalToBinary() {
  const input = document.getElementById('inputField').value.trim();
  const output = document.getElementById('outputLabel');
  const decimal = parseInt(input);
  if (isNaN(decimal)) {
    showOutput("⚠️ Invalid input. Please enter a decimal number.");
  } else {
    showOutput("Binary: " + decimal.toString(2));
  }
}

function binaryToDecimal() {
  const input = document.getElementById('inputField').value.trim();
  if (!/^[01]+$/.test(input)) {
    showOutput("⚠️ Invalid input. Please enter a valid binary number.");
  } else {
    showOutput("Decimal: " + parseInt(input, 2));
  }
}

function clearOutput() {
  const output = document.getElementById('outputLabel');
  document.getElementById('inputField').value = "";
  output.classList.remove("show");
  output.textContent = "";
}

function showOutput(message) {
  const output = document.getElementById('outputLabel');
  output.textContent = message;
  output.classList.add("show");
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
  const btn = document.querySelector('.toggle-dark');
  btn.textContent = document.body.classList.contains("dark") ? "☀️ Light Mode" : "🌙 Dark Mode";
}
</script>

</body>
</html>
